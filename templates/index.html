<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기숙사 안내 챗봇</title>
  <meta name="description" content="기숙사 거주자를 위한 AI 안내 챗봇 — 입퇴실, 규정, 시설 등 궁금한 것을 질문하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>



  <div class="chat-wrap">

    <!-- 상단 헤더 -->
    <header class="chat-header">
      <div class="header-left">
        <span class="header-icon">🏢</span>
        <div>
          <h1 class="header-title">온기 가득, TSP총괄 기숙사</h1>
          <p class="header-sub">관리자가 등록한 답변을 토대로 답변합니다.</p>
        </div>
      </div>
      <div class="header-right">
        <span class="status-badge"><span class="status-dot"></span>거주자</span>
        <a href="/admin" class="admin-btn" id="admin-link">관리자 권한</a>
      </div>
    </header>

    <!-- 채팅 메시지 영역 -->
    <main class="chat-messages" id="chat-messages" aria-live="polite">

      <!-- 웰컴 메시지 -->
      <div class="message bot-message" id="welcome-msg">
        <div class="avatar bot-avatar">🏢</div>
        <div class="message-bubble">
          <p>안녕하세요! <strong>기숙사 안내 챗봇</strong>입니다 😊</p>
          <p>입퇴실, 규정, 시설 관리 등 궁금한 내용을 아래에 자유롭게 입력해 주세요.</p>
          <div class="quick-chips">
            <button class="chip" onclick="sendQuick('외박 신청은 어떻게 하나요?')" id="chip-1">🏠 외박 신청</button>
            <button class="chip" onclick="sendQuick('관리자 근무 시간이 어떻게 되나요?')" id="chip-2">🕐 관리 시간</button>
            <button class="chip" onclick="sendQuick('기숙사 벌점 기준이 뭐야?')" id="chip-3">⚠️ 벌점 기준</button>
            <button class="chip" onclick="sendQuick('퇴실 청소 기준 알려줘')" id="chip-4">🚿 퇴실 청소</button>
            <button class="chip" onclick="sendQuick('공용 세탁기 고장 신고 어떻게 해?')" id="chip-5">🧺 세탁기 고장</button>
            <button class="chip" onclick="sendQuick('배달 음식 수령 어디서 해?')" id="chip-6">🛵 배달 수령</button>
          </div>
        </div>
      </div>

    </main>

    <!-- 입력 영역 -->
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="user-input" class="chat-input" placeholder="기숙사 생활의 모든 것, 여기에 검색해 보세요." rows="1"
          aria-label="질문 입력" onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" aria-label="전송">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

  </div>

  <script src="/static/chat.js"></script>

</body>

</html>
